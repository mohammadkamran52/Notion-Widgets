<!--
Use one file for every widget. Add parameters to the URL:
 ?w=clock
 ?w=timer&s=30&label=Recording        (s = seconds)   or  &m=60  (m = minutes)
 ?w=pomo   (&focus=25&brk=5&long=15&auto=1)
 ?w=stopwatch
 ?w=banner&text=Build%20something
 Optional on any widget: &a=ffb36b (accent hex)  &bg=191919 (background hex)
 Space bar = start / pause.
-->
